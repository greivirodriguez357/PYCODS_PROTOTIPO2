<div class="auth-page">
  <div class="pycods-card auth-card auth-card--wide text-center">
    <div class="mb-4">
      <app-mascot [size]="130" mood="cheer"></app-mascot>
      <h2 class="text-3xl font-bold text-indigo-700 m-1">Crear Cuenta</h2>
      <p class="text-500 font-medium">¡Únete a la aventura de aprender Python!</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="flex flex-column gap-3 text-left">
      <div class="flex flex-column gap-2">
        <label for="nombre" class="font-semibold text-700">Nombre Completo</label>
        <input id="nombre" type="text" pInputText formControlName="nombre" placeholder="Ej: Samuel Rodríguez" class="w-full" />
      </div>

      <div class="flex flex-column gap-2">
        <label for="email" class="font-semibold text-700">Correo Electrónico</label>
        <input id="email" type="email" pInputText formControlName="email" placeholder="tu@correo.com" class="w-full" />
      </div>

      <div class="flex flex-column gap-2">
        <label for="password" class="font-semibold text-700">Contraseña</label>
        <p-password id="password" formControlName="password" [toggleMask]="true" placeholder="••••••••" styleClass="w-full" inputStyleClass="w-full"></p-password>
      </div>

      <div class="flex flex-column gap-2">
        <label for="rol" class="font-semibold text-700">Tipo de Usuario</label>
        <p-dropdown id="rol" [options]="roles" formControlName="rol" optionLabel="label" optionValue="value" styleClass="w-full"></p-dropdown>
      </div>

      <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage" styleClass="w-full"></p-message>

      <button pButton type="submit" label="Registrarse ✨" class="p-button-indigo w-full mt-3" [disabled]="registerForm.invalid || loading" [loading]="loading"></button>

      <div class="text-center mt-2">
        <span class="text-600 font-medium">¿Ya tienes cuenta? </span>
        <a routerLink="/login" class="text-indigo-600 font-bold no-underline hover:underline">Inicia sesión</a>
      </div>
    </form>
  </div>
</div>
